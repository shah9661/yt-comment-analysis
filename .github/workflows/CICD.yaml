name: CICD Pipeline
on: push
jobs:
  model-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline

        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1 
        run: |
          dvc repro
      - name: Push changes to DVC remote 
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
        run: |
            dvc push

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add changes to Git
        run: |
          git add .
      
      - name: Commit changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git commit -m "Automated commit of DVC outputs and updated code" || echo "No changes to commit"
      
      - name: Push changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${{ github.ref_name }}
          
      
      - name: Install test dependencies
        run: |
          pip install pytest requests

      - name: Run model loading test
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest -v tests/test_load_model.py
    
      - name: Model performance test
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest -v tests/test_model_performance.py

      - name: Model promote test
        if: success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest -v tests/test_promote_model.py
      

      - name: Login to AWS ECR
        if: success()
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID_EC2_ECR }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY_EC2_ECR }}
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 213470585605.dkr.ecr.eu-north-1.amazonaws.com
      

      - name: Build Docker image
        if: success()
        run: |
          docker build -t yt_comment_analysis .

      - name: Tag Docker image
        if: success()
        run: |
          docker tag yt_comment_analysis:latest 213470585605.dkr.ecr.eu-north-1.amazonaws.com/yt_comment_analysis:latest  
      

      - name: Push Docker image to AWS ECR
        if: success()
        run: |
          docker push 213470585605.dkr.ecr.eu-north-1.amazonaws.com/yt_comment_analysis:latest

      
      - name: Deploy to EC2
        if: success()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "$EC2_SSH_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem
          ssh -o StrictHostKeyChecking=no -i ec2-key.pem $EC2_USERNAME@$EC2_HOST << EOF

          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 213470585605.dkr.ecr.eu-north-1.amazonaws.com

          docker pull 213470585605.dkr.ecr.eu-north-1.amazonaws.com/yt_comment_analysis:latest

          docker stop yt-sentiment-api || true
          docker rm yt-sentiment-api || true

          docker run -d --name yt-sentiment-api -p 8000:8000 -e DAGSHUB_TOKEN="$DAGSHUB_TOKEN" 213470585605.dkr.ecr.eu-north-1.amazonaws.com/yt_comment_analysis:latest
          
          EOF
          rm -f ec2-key.pem
