[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "yt_sentiment_analysis"
version = "0.0.1"
description = "Analysis the sentiment on the basis of comments"
authors = [
  { name = "shanshad" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["yt_sentiment_analysis"]
include = ["pyproject.toml", "yt_sentiment_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["yt_sentiment_analysis"]
force-sort-within-sections = true

